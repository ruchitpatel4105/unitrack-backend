<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Uni-Track Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #f1f5f9;
    }
    .custom-bus-marker {
      background: #059669;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      border: 2px solid white;
      white-space: nowrap;
      animation: pulse-green 2s infinite;
    }
    .custom-bus-marker.stopped {
      background: #3b82f6;
      animation: none;
    }
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .custom-stop-marker {
      width: 24px;
      height: 24px;
      background: #f59e0b;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      font-family: sans-serif;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView([22.2887, 73.3634], 15); // Parul University Campus, Vadodara

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    var busMarkers = {};
    var stopMarkers = [];
    var routeLine = null;

    // Campus Stops at Parul University
    var campusStops = [
      { order: 1, name: "Parul Main Gate & Admin Block", lat: 22.2887, lng: 73.3634 },
      { order: 2, name: "Faculty of Engineering & IT", lat: 22.2895, lng: 73.3648 },
      { order: 3, name: "Parul Sevashram Hospital & Medical Quad", lat: 22.2908, lng: 73.3620 },
      { order: 4, name: "Central Library & Student Activity Center", lat: 22.2878, lng: 73.3612 },
      { order: 5, name: "Hostel Enclaves & Sports Pavilion", lat: 22.2862, lng: 73.3640 }
    ];

    // Add Stop Markers
    campusStops.forEach(function(s) {
      var icon = L.divIcon({
        className: '',
        html: '<div class="custom-stop-marker">' + s.order + '</div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
      var marker = L.marker([s.lat, s.lng], { icon: icon }).addTo(map);
      marker.bindPopup('<b>Stop #' + s.order + '</b><br>' + s.name);
      stopMarkers.push(marker);
    });

    // Draw campus loop route line
    var stopCoords = campusStops.map(function(s) { return [s.lat, s.lng]; });
    stopCoords.push(stopCoords[0]); // loop back
    routeLine = L.polyline(stopCoords, {
      color: '#059669',
      weight: 4,
      opacity: 0.8,
      dashArray: '8, 8'
    }).addTo(map);

    // API called from Android Java
    window.updateBusLocation = function(busId, busNumber, lat, lng, speed, heading) {
      var isMoving = speed > 0;
      var label = '🚌 ' + busNumber + (isMoving ? ' (' + Math.round(speed) + ' km/h)' : ' (Idle)');
      var className = isMoving ? 'custom-bus-marker' : 'custom-bus-marker stopped';

      var icon = L.divIcon({
        className: '',
        html: '<div class="' + className + '">' + label + '</div>',
        iconSize: [120, 30],
        iconAnchor: [60, 15]
      });

      if (busMarkers[busId]) {
        busMarkers[busId].setLatLng([lat, lng]);
        busMarkers[busId].setIcon(icon);
      } else {
        var marker = L.marker([lat, lng], { icon: icon }).addTo(map);
        marker.bindPopup('<b>' + busNumber + '</b><br>Speed: ' + speed + ' km/h');
        busMarkers[busId] = marker;
      }

      map.panTo([lat, lng]);
    };

    window.clearBuses = function() {
      for (var id in busMarkers) {
        map.removeLayer(busMarkers[id]);
      }
      busMarkers = {};
    };

    window.centerOnCampus = function() {
      map.setView([22.2887, 73.3634], 15);
    };
  </script>
</body>
</html>
